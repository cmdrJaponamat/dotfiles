; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.3
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "mountain.jpg"
use-background-color = false
background-color = "#282828"
blur = 24
brightness = -0.15
saturation = -0.35
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "RedHatDisplay"
font-size = 88
font-weight = 900
color = "#ebdbb2"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_GB"
font-family = "RedHatDisplay"
font-size = 18
font-weight = 600
color = "#ebdbb2"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "RedHatDisplay"
font-size = 15
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 18
color = "#ebdbb2"
paint-icon = true
spacing = 0

[LoginScreen]
background = "mountain.jpg"
use-background-color = false
background-color = "#282828"
blur = 12
brightness = -0.10
saturation = -0.20

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 92
inactive-opacity = 0.85
active-border-size = 3
inactive-border-size = 2
active-border-color = "#98971a"
inactive-border-color = "#b8bb26"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "RedHatDisplay"
font-size = 22
font-weight = 700
color = "#ebdbb2"
margin = 14

[LoginScreen.LoginArea.PasswordInput]
width = 280
height = 42
display-icon = true
font-family = "RedHatDisplay"
font-size = 16
icon = "password.svg"
icon-size = 18
content-color = "#ebdbb2"
background-color = "#3c3836"
background-opacity = 0.85
border-size = 1
border-color = "#98971a"
border-radius-left = 10
border-radius-right = 10
margin-top = 14
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#3c3836"
background-opacity = 0.85
active-background-color = "#504945"
active-background-opacity = 0.95
icon = "arrow-right.svg"
icon-size = 20
content-color = "#ebdbb2"
active-content-color = "#fbf1c7"
border-size = 1
border-color = "#98971a"
border-radius-left = 10
border-radius-right = 10
margin-left = 8
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "RedHatDisplay"
font-size = 15
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "RedHatDisplay"
font-weight = 600
font-size = 18
icon-size = 34
icon = "spinner.svg"
color = "#ebdbb2"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "RedHatDisplay"
font-size = 14
font-weight = 400
normal-color = "#ebdbb2"
warning-color = "#ebdbb2"
error-color = "#ebdbb2"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 36
border-radius = 5
spacing = 14
font-family = "RedHatDisplay"

[LoginScreen.MenuArea.Popups]
max-height = 360
item-height = 38
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#3c3836"
background-opacity = 0.75
active-option-background-color = "#504945"
active-option-background-opacity = 0.95
content-color = "#ebdbb2"
active-content-color = "#fbf1c7"
font-family = "RedHatDisplay"
border-size = 1
border-color = "#98971a"
font-size = 14
icon-size = 18

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = false
button-width = 240
popup-width = 240
background-color = "#3c3836"
background-opacity = 0.75
active-background-color = "#504945"
active-background-opacity = 0.95
content-color = "#d79921"
active-content-color = "#fabd2f"
border-size = 1
font-size = 13
icon-size = 18

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 220
display-layout-name = true
background-color = "#3c3836"
background-opacity = 0.75
active-background-opacity = 0.95
content-color = "#d79921"
active-content-color = "#fabd2f"
border-size = 1
font-size = 13
icon = "language.svg"
icon-size = 18

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-center"
index = 0
background-color = "#3c3836"
background-opacity = 0.75
active-background-opacity = 0.95
content-color = "#d79921"
active-content-color = "#fabd2f"
border-size = 1
icon = "keyboard.svg"
icon-size = 18

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 120
background-color = "#3c3836"
background-opacity = 0.75
active-background-opacity = 0.95
content-color = "#d79921"
active-content-color = "#fabd2f"
border-size = 1
icon = "power.svg"
icon-size = 18

[Tooltips]
enable = true
font-family = "RedHatDisplay"
font-size = 13
content-color = "#ebdbb2"
background-color = "#282828"
background-opacity = 0.75
border-radius = 5
disable-user = false
disable-login-button = false

[LoginScreen.VirtualKeyboard]
scale = 1.15
position = "login"
start-hidden = true
background-color = "#3c3836"
background-opacity = 0.60
key-color = "#3c3836"
key-opacity = 0.80
key-content-color = "#ebdbb2"
key-active-background-color = "#504945"
key-active-opacity = 0.9
selection-background-color = "#665c54"
selection-content-color = "#ebdbb2"
primary-color = "#3c3836"
border-size = 1
border-color = "#504945"
